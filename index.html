
  <!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta do Clima</title>

    <!-- Conecta o HTML com o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- parte principal do sistema -->
    <div class="clima">

        <!-- Título da página -->
        <h1>Consulta do Clima</h1>

        <!--  Área da pesquisa -->
        <div class="pesquisa">

            <!-- parte para digitar a cidade -->
            <input 
                type="text" 
                id="cidade" 
                placeholder="Digite uma cidade"
            >

            <!-- Botão que faz a pesquisa -->
            <button onclick="buscarClima()">Buscar</button>

        </div>

        <!-- Mensagem apresentada ao usuário -->
        <p id="mensagem">
            Digite uma cidade para consultar.
        </p>

    </div>

    <!-- JavaScript para fazer o botão funcionar -->
    <script>
        function buscarClima() {
            let cidade = document.getElementById("cidade").value;

            if (cidade === "") {
                document.getElementById("mensagem").innerText =
                    "Digite uma cidade para consultar.";
            } else {
                document.getElementById("mensagem").innerText =
                    "Você pesquisou: " + cidade;
            }
        }
    </script>
<script src="script.js"></script>
</body>
</html>
